[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-repair"
version = "1.0.0"
description = "Temporal Hand Labanotation priors for robust control of frozen video diffusion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Haotian Lu", email = "haotialu666@gmail.com"},
  {name = "Xiaoping Zhang", email = "xpzhang@ieee.org"},
]
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
hlrepair-train = "hlrepair.train:main"
hlrepair-eval = "hlrepair.evaluate:main"
hlrepair-infer = "hlrepair.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
